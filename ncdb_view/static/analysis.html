<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCDB Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-baseline space-x-3">
                <span class="text-xs font-mono uppercase tracking-wider text-slate-400">Database:</span>
                <h1 id="db-filename" class="text-lg font-bold tracking-tight text-white border-b border-dotted border-slate-500 cursor-help" title="Loading...">
                    Loading...
                </h1>
                <span id="db-meta-count" class="text-xs font-mono text-slate-400">0 datasets</span>
            </div>
            <div>
                <a href="index.html" class="inline-block bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded font-medium transition shadow">
                    &larr; Dashboard
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
        
        <div class="md:col-span-5 space-y-4">
            
            <section class="bg-white rounded shadow p-4 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-0.5">Dataset</label>
                    <select id="select-dataset" class="w-full p-1.5 border border-gray-300 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs"></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-0.5">Observation Space</label>
                    <select id="select-obsspace" class="w-full p-1.5 border border-gray-300 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs" disabled>
                        <option value="">-- Select a Dataset First --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-0.5">Variable</label>
                    <select id="select-variable" class="w-full p-1.5 border border-gray-300 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs" disabled>
                        <option value="">-- Select an Obs Space First --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-0.5">Attribute</label>
                    <select id="select-attribute" class="w-full p-1.5 border border-gray-300 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs" disabled>
                        <option value="">-- Select a Variable First --</option>
                    </select>
                </div>

                <button id="btn-add-spec" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-medium py-1.5 rounded transition shadow-sm" disabled>
                    Add to Plot
                </button>
            </section>

            <section class="bg-white rounded shadow p-4 space-y-2">
                <div class="flex justify-end items-center">
                    <button id="btn-clear" class="text-xs text-red-600 hover:text-red-500 font-medium">Clear All</button>
                </div>
                
                <ul id="specs-basket" class="space-y-1 max-h-40 overflow-y-auto pr-1">
                    <li class="text-xs text-gray-400 italic py-1 empty-msg">No specifications added yet.</li>
                </ul>

                <button id="btn-render" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-1.5 rounded transition tracking-wide shadow hidden">
                    Render Plot
                </button>
            </section>
            
        </div>

        <section id="canvas-section" class="md:col-span-7 bg-white rounded shadow p-3 flex justify-center items-center min-h-[400px] hidden">
            <div id="plot-loading" class="text-xs text-gray-500 italic hidden">Generating plots...</div>
            <img id="plot-img" src="" alt="NCDB Output Canvas" class="max-w-full h-auto border border-gray-200 rounded shadow-inner hidden">
        </section>

    </main>

	<script type="module" src="analysis.js"></script>
</body>
</html>
