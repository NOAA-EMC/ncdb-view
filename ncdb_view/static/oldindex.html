<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCDB Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow border-b border-slate-800 p-4">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-baseline space-x-3">
                <span class="text-xs font-mono uppercase tracking-wider text-slate-400">Database:</span>
                <h1 id="db-filename" class="text-lg font-bold tracking-tight text-white border-b border-dotted border-slate-500 cursor-help" title="Loading...">
                    Loading...
                </h1>
                <span id="db-meta-count" class="text-xs font-mono text-slate-400">0 datasets</span>
            </div>
            <div>
                <a href="analysis.html" class="inline-block bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded font-medium transition shadow">
                    Analysis &rarr;
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4">

        <section class="bg-white rounded shadow px-4 py-2">
            <div id="datasets-loading" class="text-gray-500 italic text-xs py-2">Loading...</div>
            <ul id="datasets-list" class="divide-y divide-gray-200 hidden">
                </ul>
        </section>

        <section class="bg-white rounded shadow p-4">
            <form id="scan-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-0.5">Data Root Path</label>
                    <input type="text" id="data-root" required placeholder="/path/to/data"
                           class="w-full p-1.5 text-xs border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-0.5">Scanner Type</label>
                        <select id="scanner-type" class="w-full p-1.5 text-xs border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="marine">MarineDA</option>
                            <option value="obsforge">ObsForge</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-0.5">Max Cycles</label>
                        <input type="number" id="n-cycles" value="-1" required
                               class="w-full p-1.5 text-xs border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit" id="scan-btn" 
                        class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-medium py-1.5 rounded transition tracking-wide shadow-sm">
                    Scan
                </button>
            </form>
        </section>

        <section id="terminal-section" class="bg-gray-900 rounded p-3 shadow hidden">
            <div class="flex justify-between items-center mb-1.5">
                <span class="text-[10px] font-mono text-gray-400 tracking-wider uppercase">Console</span>
                <span id="terminal-status" class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-amber-400 text-amber-950 animate-pulse">Running</span>
            </div>
            <pre id="terminal-output" class="font-mono text-xs text-green-400 overflow-x-auto whitespace-pre-wrap max-h-80 bg-black p-2 rounded border border-gray-800"></pre>
        </section>

    </main>

    <script src="index.js"></script>
</body>
</html>
